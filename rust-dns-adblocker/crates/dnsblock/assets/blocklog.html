<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>dnsblock – Block-/Allow-Log</title>
<style>
  :root { --bg:#0f1216; --panel:#171c23; --panel2:#1e242d; --line:#2a323d; --text:#dbe4ee; --muted:#8b98a8; --green:#46d18f; --red:#ff6b6b; --yellow:#ffd166; --blue:#6ea8fe; --accent:#7ee787; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:var(--bg); color:var(--text); font:15px/1.5 system-ui,sans-serif; padding:24px; max-width:1100px; margin:0 auto; }
  header { margin-bottom:20px; }
  header h1 { font-size:22px; letter-spacing:.5px; }
  header .hint { color:var(--muted); font-size:13px; }
  header nav { margin-top:10px; } header nav a { color:var(--blue); text-decoration:none; margin-right:14px; font-size:14px; }
  .sec { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:16px 18px; margin-bottom:18px; }
  .sec h2 { font-size:15px; margin-bottom:10px; color:var(--accent); text-transform:uppercase; letter-spacing:.6px; }
  table { width:100%; border-collapse:collapse; font-size:13.5px; }
  th, td { text-align:left; padding:6px 8px; border-bottom:1px solid var(--line); word-break:break-all; }
  th { color:var(--muted); font-weight:600; font-size:12px; text-transform:uppercase; }
  tr:last-child td { border-bottom:0; }
  .pill { display:inline-block; padding:2px 9px; border-radius:20px; font-size:12px; font-weight:600; }
  .pill.b { background:rgba(255,107,107,.14); color:var(--red); }
  .pill.f { background:rgba(70,209,143,.14); color:var(--green); }
  .pill.x { background:rgba(255,209,102,.14); color:var(--yellow); }
  .muted { color:var(--muted); }
</style>
</head>
<body>
<header>
  <h1>🛡 dnsblock</h1>
  <span class="hint">Rust-DNS-Adblocker · Open-Source-DNS-Blocker</span>
  <nav>
       <a href="/">Dashboard</a>
       <a href="/setup">Setup</a>
       <a href="/blocklists">Blocklisten</a>
       <a href="/test">Testseite</a>
       <a href="/yt-addon">YT-Addon</a>
    </nav>
</header>

<div class="sec">
  <h2>Block-/Allow-Log (Query-Log, RAM-only)</h2>
  <table><thead><tr><th>Zeit</th><th>Dominäne</th><th>Aktion</th></tr></thead><tbody id="log_body">Lade …</tbody></table>
</div>

<script>
"use strict";
const $ = id => document.getElementById(id);
async function jf(url) { const r = await fetch(url); if (!r.ok) throw new Error(url + " → HTTP " + r.status); return r.json(); }
async function load() {
  try {
    const r = await jf("/api/blocklog");
    $("log_body").innerHTML = (r.log ?? []).slice().reverse().map(e =>
      `<tr><td class="muted">${new Date(e.ts).toLocaleTimeString("de-DE")}</td><td>${e.qname}</td><td>${e.action === "blocked" ? '<span class="pill b">geblockt</span>' : e.action === "failed" ? '<span class="pill x">fehler</span>' : '<span class="pill f">weitergeleitet</span>'}</td></tr>`).join("") || '<tr><td colspan="3" class="muted">Noch keine Queries geloggt.</td></tr>';
  } catch (e) { console.error(e); }
}
load();
setInterval(load, 5000);
</script>
</body>
</html>

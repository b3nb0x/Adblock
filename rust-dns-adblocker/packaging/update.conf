# dnsblock – Auto-Update-Einstellungen
# (beim Update/Upgrade NICHT überschrieben; einfach editieren)
#
# AUTO_UPDATE = yes|no   Schalter für den automatischen Update-Check
# MODE       = server|pi|docker   Installations-Modus
#
# Rhythmus: systemd-Timer weckt täglich; das Update-Script debounct auf
# alle 2 Tage (Stempel: /var/lib/dnsblock/.last_update_check).
# Manuelles Erzwingen:  dnsblock-update --force

AUTO_UPDATE=yes
MODE=server

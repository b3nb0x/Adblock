[workspace]
resolver = "2"
members = ["crates/filter-engine", "crates/dnsblock"]

[workspace.package]
version = "0.2.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "macros", "signal", "io-util", "sync", "fs"] }
hickory-proto = "0.24"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
